<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>InfoNews - Região</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1><a href="index.html">InfoNews</a></h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="regiao.html?r=sul">Sul</a></li>
        <li><a href="regiao.html?r=sudeste">Sudeste</a></li>
        <li><a href="regiao.html?r=norte">Norte</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li id="nav-auth"></li>
      </ul>
    </nav>
  </header>

  <div class="container">
    <h2 id="region-title">Notícias da Região</h2>
    <div id="public-news" class="grid-noticias"></div>
  </div>

  <footer>
    <p>&copy; 2026 - InfoNews ADS</p>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const regiao = urlParams.get('r');
      if (regiao) {
        document.getElementById('region-title').innerText = `Notícias da Região: ${regiao.toUpperCase()}`;
        renderPublicNews(regiao);
      }
    });
  </script>
</body>
</html>
